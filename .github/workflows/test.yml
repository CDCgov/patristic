name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Tests run against dist/, so the committed build must match src/.
      - run: npm run build
      - name: Check that dist/patristic.js is up to date
        run: git diff --exit-code dist/patristic.js
      - run: npm test

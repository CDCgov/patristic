name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Tests run against dist/, so the committed build must match src/.
      - run: npm run build
      - name: Check that the built files in dist/ are committed and up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            git status dist
            git diff dist
            exit 1
          fi
      - run: npm run typecheck
      # Fails if any line or branch of src/ goes untested.
      - run: npm run coverage
